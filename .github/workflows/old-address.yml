name: Old address redirect

# Cloudflare builds and deploys the site itself: the repo is connected to the systems-workbench Worker in the
# Cloudflare dashboard (Workers Builds: build command `pnpm run build`, deploy command `npx wrangler deploy`, which
# uploads dist/ as static assets per wrangler.jsonc).
#
# This workflow keeps the old GitHub Pages address (https://dbritto-dev.github.io/systems-workbench/) pointing there:
# on every push to main it builds the site, writes a small page for each of its pages that forwards to the same page
# on SITE_URL (tools/github-pages-redirect.mjs), and publishes those to GitHub Pages once SITE_URL answers.
#
# SITE_URL is the repository variable of that name (the Worker's workers.dev address or a custom domain); set the
# same value as a build variable in the Worker's build settings, so the site's canonical links match.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: old-address
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check SITE_URL is set
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable to the site's Cloudflare address."
            exit 1
          fi
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build the redirect pages
        run: node tools/github-pages-redirect.mjs dist github-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never point the old address at a site that isn't up: wait for Cloudflare's deploy to answer (up to 20 min).
      - name: Wait for the site on Cloudflare
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/") || true
            [ "$code" = "200" ] && exit 0
            echo "$SITE_URL answered $code; waiting"
            sleep 30
          done
          echo "::error::$SITE_URL never answered 200"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
