name: Deploy

# On every push to main: build the site, deploy it to Cloudflare Pages, and refresh the redirect site the old
# GitHub Pages address (https://dbritto-dev.github.io/systems-workbench/) serves, which sends each old URL to the
# same page on Cloudflare.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (an API token with the "Cloudflare Pages: Edit" permission)
# and CLOUDFLARE_ACCOUNT_ID. The site's address comes from the SITE_URL repository variable; without it, the
# default Cloudflare Pages address of the systems-workbench project.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://systems-workbench.pages.dev' }}
  PROJECT: systems-workbench

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Exports every lesson's page data from its build.mjs, then builds the Astro site into dist/, for the root of
      # SITE_URL.
      - run: pnpm run build
      - name: Build the redirect site for the old GitHub Pages address
        run: node tools/github-pages-redirect.mjs dist github-pages
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: 4.161.0
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi
          # The first deploy creates the Pages project (production branch: main).
          if ! npx -y "wrangler@$WRANGLER" pages project list | grep -qE "(^|[^-[:alnum:]])$PROJECT([^-[:alnum:]]|$)"; then
            npx -y "wrangler@$WRANGLER" pages project create "$PROJECT" --production-branch=main
          fi
          npx -y "wrangler@$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="${COMMIT_MESSAGE%%$'\n'*}"

  github-pages:
    # After Cloudflare has the site, so the old address never points at a page that isn't there yet.
    needs: [build, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
